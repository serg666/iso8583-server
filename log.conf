# Logging configuration
[loggers]
keys = root, server

[handlers]
#keys = console, syslog
#keys = console, filelog
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
#handlers = console, filelog
#handlers = syslog

[logger_server]
level = DEBUG
handlers =
qualname = server

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

#[handler_syslog]
#class = handlers.SysLogHandler
#level = NOTSET
#formatter = generic
#args = ('/dev/log',)

[formatter_generic]
format = %(asctime)s,%(msecs)03d %(levelname)-7.7s %(name)s: [%(threadName)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
